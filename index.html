<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3a83">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="12タイマー">
<link rel="manifest" href="./manifest.webmanifest">
<title>店舗用 12タイマー</title>
<style>
:root{
  --navy:#0b1f3a; --blue:#0b63ce; --blue2:#eaf3ff; --yellow:#ffd43b;
  --bg:#eef3f8; --card:#fff; --text:#102033; --muted:#6b7a90;
  --green:#0f9d58; --orange:#f59e0b; --red:#dc2626; --line:#d9e2ec;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);touch-action:manipulation}
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:10px 14px calc(10px + env(safe-area-inset-top));box-shadow:0 3px 14px rgba(0,0,0,.18)}
.header-inner{max-width:1500px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo-dot{width:34px;height:34px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;color:var(--navy);font-weight:1000}
h1{font-size:clamp(20px,2.2vw,30px);margin:0;font-weight:1000;letter-spacing:.02em}
.summary{display:flex;gap:8px;flex-wrap:wrap}
.badge{border-radius:999px;padding:7px 11px;font-weight:900;font-size:13px;background:#223957}
.badge.run{background:#0b7b4b}.badge.end{background:#a11b1b}
main{max-width:1500px;margin:auto;padding:10px 12px 20px}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.topbar button{min-height:42px}
button,input{font:inherit}
button{border:0;border-radius:10px;padding:10px 12px;font-weight:900;cursor:pointer}
.btn-soft{background:#dde6f0;color:#17304f}.btn-red{background:#fee2e2;color:#991b1b}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.card{background:#fff;border:3px solid transparent;border-radius:16px;padding:10px;box-shadow:0 6px 18px rgba(16,32,51,.08)}
.card.running{border-color:#34d399}.card.warn5{border-color:#f7b733;background:#fffaf0}.card.warn1{border-color:#f97316;background:#fff6ed}.card.done{border-color:#ef4444;background:#fff1f2;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.22)}50%{box-shadow:0 0 0 7px rgba(239,68,68,.1)}}
.card-head{display:flex;align-items:center;gap:8px}
.num{width:38px;height:38px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:1000;flex:0 0 auto}
.name{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-weight:900;background:#fff}
.clock{text-align:center;font-weight:1000;font-variant-numeric:tabular-nums;letter-spacing:.02em;font-size:clamp(36px,4vw,60px);line-height:1;margin:10px 0 6px}
.endtime{text-align:center;font-weight:900;color:#334155;font-size:14px;min-height:20px}
.status{text-align:center;font-size:12px;color:var(--muted);font-weight:900;margin-bottom:8px;min-height:18px}
.primary-presets{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}
.primary-presets button{font-size:18px;min-height:48px}
.p30{background:#eaf3ff;color:#104d96}.p60{background:#fff3bf;color:#7a5600}
.secondary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:7px}
.secondary button{background:#edf2f7;color:#334155;padding:8px 4px;min-height:38px}
.actions{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px}
.start{background:var(--blue);color:white}.pause{background:#fef3c7;color:#92400e}.reset{background:#e2e8f0;color:#334155}
.extend{width:100%;margin-top:7px;background:#dff7ea;color:#0b6b40}
.stopalarm{display:none;width:100%;margin-top:7px;background:var(--red);color:#fff;font-size:16px}
.card.done .stopalarm{display:block}
.customrow{display:flex;gap:6px;margin-top:7px}
.customrow input{width:100%;min-width:0;border:1px solid var(--line);border-radius:9px;padding:8px;text-align:center;font-weight:900}
.customrow button{background:#e2e8f0;white-space:nowrap}
.notice{margin:8px 0 0;text-align:center;color:#6b7a90;font-size:12px}
.noscript{margin:20px;background:#fff3cd;border:2px solid #f59e0b;border-radius:12px;padding:18px;font-weight:800}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.summary{display:none}}
@media(max-width:480px){main{padding:8px}.grid{gap:8px}.card{padding:8px}.clock{font-size:36px}.primary-presets button{font-size:16px}.secondary button{font-size:12px}.actions button{font-size:12px;padding:8px 4px}}
</style>
<style id="monitor-fit">
@media (min-width:900px) and (orientation:landscape){
html,body{height:100%;overflow:hidden}
header{position:relative;height:48px;padding:5px 10px}.header-inner{height:38px}
.logo-dot{width:29px;height:29px}h1{font-size:20px}.badge{padding:4px 8px;font-size:11px}
main{height:calc(100vh - 48px);padding:5px 9px;display:flex;flex-direction:column;overflow:hidden}
.topbar{margin-bottom:4px;gap:5px;flex:0 0 auto}.topbar button{min-height:29px;padding:4px 8px;font-size:11px}
.grid{flex:1;min-height:0;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:5px}
.card{min-height:0;padding:5px;border-width:2px;border-radius:10px;overflow:hidden}
.card-head{gap:4px}.num{width:27px;height:27px;border-radius:7px;font-size:13px}
.name{height:27px;padding:4px 6px;font-size:11px}
.clock{font-size:clamp(24px,3.5vh,34px);margin:3px 0 1px}
.endtime{font-size:10px;min-height:12px;line-height:12px}.status{font-size:9px;margin-bottom:2px;min-height:11px;line-height:11px}
.primary-presets{gap:3px;margin-bottom:2px}.primary-presets button{font-size:12px;min-height:25px;padding:2px}
.secondary{gap:3px;margin-bottom:2px}.secondary button{font-size:9px;min-height:21px;padding:2px}
.actions{gap:3px}.actions button{font-size:9px;min-height:22px;padding:2px}
.extend{margin-top:2px;padding:2px;min-height:21px;font-size:9px}
.customrow{gap:3px;margin-top:2px}.customrow input{padding:2px;height:21px;font-size:9px}.customrow button{padding:2px 5px;min-height:21px;font-size:9px}
.stopalarm{margin-top:2px;padding:2px;min-height:21px;font-size:10px}.notice{display:none}
}
</style>
</head>
<body>
<noscript><div class="noscript">このタイマーはJavaScriptを使用します。ファイルのプレビュー画面ではなく、SafariでWeb公開したURLを開いてください。</div></noscript>
<header>
<div class="header-inner">
  <div class="brand"><div class="logo-dot">HD</div><h1>店舗用 12タイマー</h1></div>
  <div class="summary">
    <span class="badge" id="idleCount">待機 12</span>
    <span class="badge run" id="runCount">稼働 0</span>
    <span class="badge end" id="endCount">終了 0</span>
  </div>
</div>
</header>
<main>
  <div class="topbar">
    <button class="btn-soft" id="pauseAll">すべて一時停止</button>
    <button class="btn-soft" id="resumeAll">すべて再開</button>
    <button class="btn-red" id="resetAll">すべてリセット</button>
  </div>
  <section class="grid" id="grid"></section>
  <div class="notice">※ 終了予定時刻とタイマー状態は端末内に自動保存されます。音を鳴らすため、使用開始時に一度画面をタップしてください。</div>
</main>
<script>
const COUNT=12, KEY="hd-12timer-v3";
let audioCtx=null, alarmTimer=null;
let alarmSet=new Set();

function baseTimer(i){
  return {id:i+1,name:`受付 ${i+1}`,duration:1800,remaining:1800,running:false,endAt:null,done:false,warned5:false,warned1:false};
}
let timers=Array.from({length:COUNT},(_,i)=>baseTimer(i));

function save(){localStorage.setItem(KEY,JSON.stringify(timers))}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY));
    if(Array.isArray(s)&&s.length===COUNT) timers=s.map((t,i)=>({...baseTimer(i),...t}));
  }catch(e){}
  syncFromClock();
}
function syncFromClock(){
  const now=Date.now();
  timers.forEach(t=>{
    if(t.running&&t.endAt){
      t.remaining=Math.max(0,Math.ceil((t.endAt-now)/1000));
      if(t.remaining<=0){t.running=false;t.done=true;t.endAt=null;alarmSet.add(t.id)}
    }
  });
}
function fmt(sec){
  sec=Math.max(0,Math.ceil(sec));
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  return h?`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function endText(t){
  if(t.done)return "終了しました";
  if(t.running&&t.endAt){
    const d=new Date(t.endAt);
    return `終了予定 ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  }
  return "終了予定 --:--";
}
function statusText(t){
  if(t.done)return "アラーム中";
  if(t.running&&t.remaining<=60)return "残り1分以内";
  if(t.running&&t.remaining<=300)return "残り5分以内";
  if(t.running)return "稼働中";
  if(t.remaining<t.duration)return "一時停止中";
  return "待機中";
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function cardClass(t){
  if(t.done)return "card done";
  if(t.running&&t.remaining<=60)return "card warn1";
  if(t.running&&t.remaining<=300)return "card warn5";
  if(t.running)return "card running";
  return "card";
}
function render(){
  const g=document.getElementById("grid"); g.innerHTML="";
  timers.forEach((t,i)=>{
    const el=document.createElement("article");
    el.className=cardClass(t);
    el.innerHTML=`
      <div class="card-head"><div class="num">${t.id}</div><input class="name" value="${esc(t.name)}" aria-label="名称"></div>
      <div class="clock">${fmt(t.remaining)}</div>
      <div class="endtime">${endText(t)}</div>
      <div class="status">${statusText(t)}</div>
      <div class="primary-presets">
        <button class="p30" data-a="preset" data-min="30">30分</button>
        <button class="p60" data-a="preset" data-min="60">60分</button>
      </div>
      <div class="secondary">
        <button data-a="preset" data-min="90">90分</button>
        <button data-a="preset" data-min="120">120分</button>
        <button data-a="preset" data-min="15">15分</button>
        <button data-a="preset" data-min="45">45分</button>
      </div>
      <div class="actions">
        <button class="start" data-a="start">${t.running?"稼働中":"スタート"}</button>
        <button class="pause" data-a="pause">一時停止</button>
        <button class="reset" data-a="reset">リセット</button>
      </div>
      <button class="extend" data-a="extend">＋30分 延長</button>
      <div class="customrow">
        <input type="number" min="1" max="999" value="30" inputmode="numeric" aria-label="任意の分数">
        <button data-a="custom">任意設定</button>
      </div>
      <button class="stopalarm" data-a="stopalarm">アラーム停止・受付終了</button>`;
    el.querySelector(".name").addEventListener("input",e=>{timers[i].name=e.target.value;save()});
    el.addEventListener("click",e=>onClick(e,i,el));
    g.appendChild(el);
  });
  updateSummary();
}
function setDuration(i,sec){
  const t=timers[i];
  t.duration=sec;t.remaining=sec;t.running=false;t.endAt=null;t.done=false;t.warned5=false;t.warned1=false;
  alarmSet.delete(t.id); save(); stopAlarmIfNone(); render();
}
function onClick(e,i,card){
  const b=e.target.closest("button"); if(!b)return;
  unlockAudio();
  const a=b.dataset.a,t=timers[i];
  if(a==="preset")setDuration(i,Number(b.dataset.min)*60);
  if(a==="custom"){
    const v=Number(card.querySelector(".customrow input").value)||0;
    if(v>0)setDuration(i,v*60);
  }
  if(a==="start"){
    if(t.done){t.done=false;t.remaining=t.duration;alarmSet.delete(t.id)}
    if(!t.running){
      if(t.remaining<=0)t.remaining=t.duration;
      t.running=true;t.endAt=Date.now()+t.remaining*1000;
      t.warned5=t.remaining<=300;t.warned1=t.remaining<=60;
      save();render();
    }
  }
  if(a==="pause"&&t.running){
    t.remaining=Math.max(0,Math.ceil((t.endAt-Date.now())/1000));t.running=false;t.endAt=null;save();render();
  }
  if(a==="reset")setDuration(i,t.duration);
  if(a==="extend"){
    const add=1800;
    if(t.running&&t.endAt){t.endAt+=add;t.remaining+=add}
    else{t.remaining+=add;t.duration=Math.max(t.duration,t.remaining)}
    t.done=false;alarmSet.delete(t.id);save();stopAlarmIfNone();render();
  }
  if(a==="stopalarm"){
    alarmSet.delete(t.id);t.done=false;t.running=false;t.endAt=null;t.remaining=t.duration;t.warned5=false;t.warned1=false;save();stopAlarmIfNone();render();
  }
}
function unlockAudio(){
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
  }catch(e){}
}
function beep(freq=880,dur=.18){
  try{
    unlockAudio(); const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.frequency.value=freq;o.type="sine";
    g.gain.setValueAtTime(.0001,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.2,audioCtx.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur+.03);
  }catch(e){}
}
function startAlarm(){
  if(alarmTimer)return;
  beep(980,.22);
  alarmTimer=setInterval(()=>{if(alarmSet.size){beep(980,.22);setTimeout(()=>beep(740,.22),260)}else stopAlarmIfNone()},1200);
}
function stopAlarmIfNone(){if(!alarmSet.size&&alarmTimer){clearInterval(alarmTimer);alarmTimer=null}}
function tick(){
  const now=Date.now();let saveNeeded=false;
  timers.forEach(t=>{
    if(!t.running||!t.endAt)return;
    const prev=t.remaining;
    t.remaining=Math.max(0,Math.ceil((t.endAt-now)/1000));
    if(prev>300&&t.remaining<=300&&!t.warned5){t.warned5=true;beep(620,.12)}
    if(prev>60&&t.remaining<=60&&!t.warned1){t.warned1=true;beep(760,.16);setTimeout(()=>beep(760,.16),220)}
    if(t.remaining<=0){t.running=false;t.done=true;t.endAt=null;alarmSet.add(t.id);startAlarm();saveNeeded=true}
  });
  document.querySelectorAll(".card").forEach((el,i)=>{
    const t=timers[i];
    el.className=cardClass(t);
    el.querySelector(".clock").textContent=fmt(t.remaining);
    el.querySelector(".endtime").textContent=endText(t);
    el.querySelector(".status").textContent=statusText(t);
    el.querySelector(".start").textContent=t.running?"稼働中":"スタート";
  });
  updateSummary();
  if(saveNeeded)save();
}
function updateSummary(){
  const r=timers.filter(t=>t.running).length,d=timers.filter(t=>t.done).length;
  document.getElementById("runCount").textContent=`稼働 ${r}`;
  document.getElementById("endCount").textContent=`終了 ${d}`;
  document.getElementById("idleCount").textContent=`待機 ${COUNT-r-d}`;
}
document.getElementById("pauseAll").onclick=()=>{
  unlockAudio();const now=Date.now();
  timers.forEach(t=>{if(t.running){t.remaining=Math.max(0,Math.ceil((t.endAt-now)/1000));t.running=false;t.endAt=null}});
  save();render();
};
document.getElementById("resumeAll").onclick=()=>{
  unlockAudio();const now=Date.now();
  timers.forEach(t=>{if(!t.running&&!t.done&&t.remaining>0&&t.remaining<t.duration){t.running=true;t.endAt=now+t.remaining*1000}});
  save();render();
};
document.getElementById("resetAll").onclick=()=>{
  unlockAudio();
  if(confirm("12個すべてのタイマーをリセットしますか？")){
    timers=timers.map((t,i)=>({...baseTimer(i),name:t.name,duration:t.duration,remaining:t.duration}));
    alarmSet.clear();stopAlarmIfNone();save();render();
  }
};
document.addEventListener("click",unlockAudio,{once:true});
document.addEventListener("visibilitychange",()=>{if(!document.hidden){load();render()}});
window.addEventListener("beforeunload",save);
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
load();render();setInterval(tick,250);
</script>
</body>
</html>
